spring.application.name=careerai-server
server.port=8081

# DeepSeek API Key
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY}

# ?? DeepSeek ??????
spring.ai.deepseek.chat.model=deepseek-chat

# U52: bound outbound HTTP waits; an Agent step limit alone cannot stop a blocked call.
spring.http.clients.connect-timeout=3s
spring.http.clients.read-timeout=60s
# Keep transient model failures from multiplying a single Agent step into long retries.
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=500ms
spring.ai.retry.backoff.max-interval=1s

# MySQL ???
spring.datasource.url=jdbc:mysql://localhost:3306/careerai
spring.datasource.username=${CAREERAI_DB_USER}
spring.datasource.password=${CAREERAI_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.ai.model.chat=deepseek
spring.ai.model.embedding=ollama
spring.ai.ollama.base-url=http://127.0.0.1:11434
spring.ai.ollama.embedding.model=bge-m3

rag.datasource.jdbc-url=jdbc:postgresql://127.0.0.1:5432/careerai_rag
rag.datasource.username=careerai
rag.datasource.password=${CAREERAI_PG_PASSWORD}
rag.datasource.driver-class-name=org.postgresql.Driver
# CareerHub ????
careerhub.base-url=http://localhost:8080

# U51 asynchronous document import is opt-in.
careerai.import.enabled=${CAREERAI_IMPORT_ENABLED:false}
spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.port=5672
spring.rabbitmq.username=${CAREERAI_RABBIT_USER:careerai}
spring.rabbitmq.password=${CAREERAI_RABBIT_PASSWORD:}
