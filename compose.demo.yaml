services:
  demo-web:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./demo/web:/usr/share/nginx/html:ro
      - ./demo/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      careerhub:
        condition: service_started
      careerai:
        condition: service_started
